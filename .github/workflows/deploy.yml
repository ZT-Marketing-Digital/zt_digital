name: 🚀 Deploy para HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez. O FTP-Deploy-Action guarda um arquivo de estado no
# servidor para saber o que mudou; dois jobs simultâneos corrompem esse
# controle e o deploy seguinte sobe tudo de novo (ou pior, sobe pela metade).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v7

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependências
        # `npm ci` em vez de `npm i`: instala exatamente o que está no
        # package-lock.json. Build reproduzível e bem mais rápido no CI.
        run: npm ci

      - name: 🔨 Build de produção
        # `npm run build` roda `tsc -b`, o Vite, o bundle SSR e o pré-render.
        # Erro de TypeScript derruba o job aqui e nada quebrado chega ao servidor.
        run: npm run build

      - name: 🔍 Conferir o build
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html não foi gerado"; exit 1; }
          test -f dist/politica-de-privacidade-e-de-pagamento/index.html || { echo "::error::Página da política não foi pré-renderizada"; exit 1; }
          # O texto precisa estar no HTML: é o que garante SEO e leitura sem JS.
          grep -q "Nosso negócio é" dist/index.html || { echo "::error::HTML saiu sem o conteúdo pré-renderizado"; exit 1; }
          # Na ZT o Pixel é injetado por JS (só após consentimento), então ele
          # vive no bundle, não no index.html.
          grep -rq "1400437541519673" dist/assets/ || { echo "::error::Meta Pixel sumiu do bundle"; exit 1; }
          test -f dist/.htaccess || { echo "::error::.htaccess não foi para o dist"; exit 1; }
          # Backend do formulário: sobe da pasta api/, num passo separado.
          test -f api/lead.php || { echo "::error::api/lead.php sumiu"; exit 1; }
          test -f api/lib/PHPMailer/PHPMailer.php || { echo "::error::PHPMailer sumiu de api/lib/"; exit 1; }
          test -f api/.htaccess || { echo "::error::api/.htaccess sumiu"; exit 1; }
          # O config.php tem senha de SMTP: não pode viajar dentro do site.
          test ! -f dist/api/config.php || { echo "::error::config.php não pode ir no dist - ele é gerado no passo seguinte e vai só para /api/"; exit 1; }
          test ! -e dist/api || { echo "::error::dist/api não deveria existir: o backend sobe da pasta api/ do repositório"; exit 1; }
          echo "Arquivos gerados:"
          ls -lh dist/

      - name: ⚙️ Gerar config.php do backend
        # O config.php não vai no repositório: o token da Conversions API é
        # secreto. Ele é montado aqui a partir do secret e sobe junto no
        # deploy da pasta api/. Sem o secret, a CAPI fica desligada e o
        # formulário funciona normalmente (e-mail + JSONL).
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_CAPI_TEST_CODE: ${{ secrets.META_CAPI_TEST_CODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          # O próprio PHP monta o arquivo com var_export: assim senha com $, #
          # ou aspas é escapada corretamente, em vez de quebrar o config.
          php -r '
            $config = [
              "notify_to" => ["ztagenciamktdigital@gmail.com"],
              "notify_from" => "noreply@ztdigital.com.br",
              "notify_from_name" => "Site ZT Digital",
              "allowed_origins" => ["https://ztdigital.com.br", "https://www.ztdigital.com.br"],
              "rate_limit_max" => 5,
              "rate_limit_window" => 600,
              "segundos_minimos_no_form" => 3,
              // trim: secret colado com quebra de linha no fim quebra o host e a
              // autenticacao. Na senha tiramos so CR e LF, porque espaco pode ser proposital.
              "smtp" => [
                "host" => trim(getenv("SMTP_HOST") ?: ""),
                "port" => (int)trim(getenv("SMTP_PORT") ?: "465"),
                "user" => trim(getenv("SMTP_USER") ?: ""),
                "pass" => trim(getenv("SMTP_PASS") ?: "", chr(13) . chr(10)),

              ],
              "meta_capi" => [
                "pixel_id" => "1400437541519673",
                "access_token" => trim(getenv("META_CAPI_TOKEN") ?: ""),
                // Preenchido = os eventos aparecem só em "Testar eventos" do
                // Events Manager. Apague o secret quando terminar de validar.
                "test_event_code" => trim(getenv("META_CAPI_TEST_CODE") ?: ""),
                "api_version" => "v25.0",
              ],
            ];
            $header = "<?php" . PHP_EOL . "// GERADO PELO DEPLOY - nao edite no servidor, edite .github/workflows/deploy.yml" . PHP_EOL;
            file_put_contents("api/config.php", $header . "return " . var_export($config, true) . ";" . PHP_EOL);
          '
          for f in api/*.php api/lib/PHPMailer/*.php; do
            php -l "$f" > /dev/null || { echo "::error::erro de sintaxe em $f"; exit 1; }
          done
          if [ -n "${SMTP_HOST}" ]; then
            echo "config.php gerado | envio por SMTP | destino: ztagenciamktdigital@gmail.com"
          else
            echo "::warning::SMTP_HOST nao definido - o e-mail sai pelo mail() do servidor, que costuma nao chegar no Gmail"
          fi

      - name: 📤 Deploy do site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # A conta de FTP do deploy deve ser criada apontando direto para a
          # raiz do site (/home2/ztdigi26/public_html), então o login já cai
          # lá dentro e "./" é a raiz do domínio.
          #
          # Se o deploy usar o usuário principal do cPanel, que entra em
          # /home2/ztdigi26/, troque para:
          #   server-dir: ./public_html/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
          # false = não apaga o que já existe no servidor fora do que
          # subimos. Nunca ligue isso sem ter backup.
          dangerous-clean-slate: false
          log-level: standard
          # O padrão (30s) é curto para conexões lentas do HostGator.
          timeout: 120000

      - name: 📤 Deploy do backend do formulário via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: ./api/
          # Estado separado do deploy do site: cada par de pastas precisa do
          # seu próprio arquivo de controle, senão um sobrescreve o do outro.
          state-name: .ftp-deploy-sync-state-api.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
          # config.php (com o e-mail e o token da Conversions API) e os leads
          # gravados em api/data/ vivem só no servidor e não estão no
          # repositório. Com clean-slate desligado, eles não são tocados.
          dangerous-clean-slate: false
          log-level: standard
          timeout: 120000

      - name: ✅ Concluído
        run: |
          echo "🎉 Deploy concluído!"
          echo "🌐 https://ztdigital.com.br"
